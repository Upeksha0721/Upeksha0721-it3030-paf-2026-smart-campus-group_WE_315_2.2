server:
  port: 8082

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:mysql://localhost:3306/campus_notifications
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect